  <pre id="boot">booting&hellip;</pre>

<script>
/* ==========================================================================
   BlockBook — single-file app (v0.x)
   Docs: ./docs/  ·  Schema contract: docs/05-DATA-SCHEMA.md
   Build order: docs/06-IMPLEMENTATION-PLAN.md
   ========================================================================== */

/* ── BLOCKBOOK LOGIC START ─────────────────────────────────────────────────
   Everything between these fences is PURE: no DOM, no state, no storage.
   The Phase 4 golden-case harness extracts and evaluates this region
   directly out of this file, so the tests can never drift from the app.
   Do not reference `state`, `document`, or `localStorage` in here.
   ────────────────────────────────────────────────────────────────────────── */

/**
 * @typedef {"overworld"|"nether"|"end"} Dimension
 *
 * @typedef {"base"|"portal"|"spawner"|"structure"|"biome"|"mine"|"farm"
 *          |"village"|"stronghold"|"fortress"|"bastion"|"monument"
 *          |"shipwreck"|"trial_chamber"|"misc"} LocationType
 *
 * @typedef {Object} Location
 * @property {string}       id              Stable, never reused
 * @property {string}       name            1-80 chars, required
 * @property {Dimension}    dimension       REQUIRED, never defaulted
 * @property {number}       x               Integer
 * @property {number|null}  y               Integer, or null for "don't care"
 * @property {number}       z               Integer
 * @property {LocationType} type            Defaults to "misc"
 * @property {string[]}     tags            Lowercase, deduped
 * @property {string}       notes           Free text, searchable
 * @property {string|null}  linkedPortalId  Portal pairing; symmetric
 * @property {boolean}      favorite
 * @property {string}       createdAt       ISO 8601 UTC
 * @property {string}       updatedAt       ISO 8601 UTC
 *
 * @typedef {Object} World
 * @property {string}     id
 * @property {string}     name
 * @property {"java"|"bedrock"} edition
 * @property {string}     gameVersion
 * @property {string|null} seed            STRING - 64-bit, do not parse as number
 * @property {string}     createdAt
 * @property {Location[]} locations
 *
 * @typedef {Object} Settings
 * @property {string}  activeWorldId
 * @property {string}  coordFormat
 * @property {boolean} alwaysOnTop
 * @property {string}  hotkey
 * @property {"dark"|"light"} theme
 *
 * @typedef {Object} BlockBookData
 * @property {number}   schemaVersion
 * @property {"blockbook"} app
 * @property {World[]}  worlds
 * @property {Settings} settings
 */

const SCHEMA_VERSION = 1;

/** The 13 fields every Location carries. Order is the schema's order. */
const LOCATION_FIELDS = [
  "id", "name", "dimension", "x", "y", "z", "type",
  "tags", "notes", "linkedPortalId", "favorite", "createdAt", "updatedAt"
];

/** @type {Dimension[]} */
const DIMENSIONS = ["overworld", "nether", "end"];

/** @type {LocationType[]} */
const LOCATION_TYPES = [
  "base", "portal", "spawner", "structure", "biome", "mine", "farm",
  "village", "stronghold", "fortress", "bastion", "monument",
  "shipwreck", "trial_chamber", "misc"
];

/** Y validation ranges, inclusive. docs/05-DATA-SCHEMA.md §4.2 */
const Y_RANGES = {
  overworld: [-64, 320],
  nether:    [0, 127],
  end:       [0, 255],
};

const DEFAULT_SETTINGS = {
  activeWorldId: "w_main",
  coordFormat:   "x / y / z",
  alwaysOnTop:   true,
  hotkey:        "Ctrl+Space",
  theme:         "dark",
};

/** Normalise tags: lowercase, trimmed, deduped, empties dropped. */
function normaliseTags(tags) {
  if (!Array.isArray(tags)) return [];
  const seen = new Set();
  for (const t of tags) {
    const v = String(t).trim().toLowerCase();
    if (v) seen.add(v);
  }
  return [...seen];
}

/**
 * Expand a partial seed row into a complete Location with all 13 fields.
 * Every required field is written explicitly — a missing key means a malformed
 * file, so the app never has to probe for `undefined`. docs/05-DATA-SCHEMA.md §4
 *
 * `dimension` is deliberately NOT defaulted: an absent dimension is preserved as
 * undefined so validation catches it, rather than being silently guessed.
 */
function normaliseLocation(raw, i, now) {
  return {
    id:             raw.id ?? `loc_${String(i + 1).padStart(3, "0")}`,
    name:           String(raw.name ?? "").trim(),
    dimension:      raw.dimension,
    x:              Math.floor(Number(raw.x)),
    y:              raw.y == null ? null : Math.floor(Number(raw.y)),
    z:              Math.floor(Number(raw.z)),
    type:           LOCATION_TYPES.includes(raw.type) ? raw.type : "misc",
    tags:           normaliseTags(raw.tags),
    notes:          String(raw.notes ?? ""),
    linkedPortalId: raw.linkedPortalId ?? null,
    favorite:       Boolean(raw.favorite),
    createdAt:      raw.createdAt ?? now,
    updatedAt:      raw.updatedAt ?? now,
  };
}

/**
 * Enforce the four linkedPortalId invariants and make every link symmetric.
 * docs/05-DATA-SCHEMA.md §4.4
 *
 * I1 set only when type === "portal"
 * I2 the target must exist
 * I3 the target must also be a portal
 * I4 the target must be in a DIFFERENT dimension
 * plus: a one-sided link is repaired by writing the reverse side.
 *
 * @returns {string[]} human-readable repairs made, for logging
 */
function repairPortalLinks(locations) {
  const byId = new Map(locations.map(l => [l.id, l]));
  const repairs = [];

  for (const loc of locations) {
    if (loc.linkedPortalId == null) continue;

    const drop = (why) => {
      repairs.push(`cleared link on "${loc.name}" — ${why}`);
      loc.linkedPortalId = null;
    };

    if (loc.type !== "portal")        { drop("I1: not a portal"); continue; }
    const target = byId.get(loc.linkedPortalId);
    if (!target)                      { drop("I2: target does not exist"); continue; }
    if (target.type !== "portal")     { drop("I3: target is not a portal"); continue; }
    if (target.dimension === loc.dimension) { drop("I4: target is in the same dimension"); continue; }

    // End portals never participate in pairing — no scaling relationship exists.
    if (loc.dimension === "end" || target.dimension === "end") {
      drop("End portals cannot be paired");
      continue;
    }
  }

  // Second pass: repair one-sided links now that invalid ones are gone.
  for (const loc of locations) {
    if (loc.linkedPortalId == null) continue;
    const target = byId.get(loc.linkedPortalId);
    if (target && target.linkedPortalId !== loc.id) {
      repairs.push(`made link symmetric: "${target.name}" → "${loc.name}"`);
      target.linkedPortalId = loc.id;
    }
  }

  return repairs;
}

/**
 * Build the full root document from a bare array of seed rows.
 * @param {Partial<Location>[]} seedLocations
 * @returns {{ data: BlockBookData, repairs: string[] }}
 */
function buildInitialData(seedLocations, now = new Date().toISOString()) {
  const locations = seedLocations.map((raw, i) => normaliseLocation(raw, i, now));
  const repairs = repairPortalLinks(locations);

  return {
    data: {
      schemaVersion: SCHEMA_VERSION,
      app: "blockbook",
      worlds: [{
        id:          "w_main",
        name:        "Survival World",
        edition:     "java",
        gameVersion: "1.21",
        seed:        null,          // STRING or null — never a JS number
        createdAt:   now,
        locations,
      }],
      settings: { ...DEFAULT_SETTINGS },
    },
    repairs,
  };
}

/* ── BLOCKBOOK LOGIC END ──────────────────────────────────────────────────── */


/* ==========================================================================
   SEED DATA
   Inlined as a JS constant rather than fetched: opening this file over
   file:// makes fetch() fail on CORS. docs/02-TRD.md §6.1
   The copy of record is data/seed.json — keep the two in step until Phase 8
   switches this over to fetch().
   ========================================================================== */

const SEED_LOCATIONS = [
  {

    tags: ["main", "storage"], favorite: true,
    notes: "Scales to nether 27 / 46. NOTE: the overworld-side nether portal at Home is not yet recorded as its own location - see PRD open question Q7. Until it is, link health for Home Portal is measured against the base, not the portal.",
  },
  {
    id: "loc_002", name: "Home Portal (Nether side)", dimension: "nether",
    x: 16, y: 46, z: 38, type: "portal",
    tags: ["main"],
    notes: "Scales to overworld 128 / 304. Home is at 221 / 374 -> nether 27 / 46, which is 13.60 nether blocks away (forward direction, tight). Backward direction is 116.40 overworld blocks - loose. Overall health: LOOSE. The BUILD_PLAN figure of 14.5 was arithmetically off; hypot(11, 8) = 13.60.",
  },
  {
    id: "loc_003", name: "Portal @ 631 / 245", dimension: "overworld",
    x: 631, y: 67, z: 245, type: "portal",
    tags: ["needs-review"],
    notes: "NEEDS REVIEW. Scales to nether 78 / 30. Home Portal (Nether side) is at 16 / 38 = 62.51 blocks away, INSIDE the 128 link radius. This portal very likely links to Home Portal rather than creating a new one. VERIFY BY WALKING THROUGH IT - this is the app's flagship correctness test (docs/09-TESTING-QA.md R1).",
  },
  {
    id: "loc_004", name: "Portal @ -495 / -394", dimension: "nether",
    x: -495, y: 66, z: -394, type: "portal",
    tags: ["needs-review"],
    notes: "NEEDS REVIEW - dimension is a guess. Was written on the same line as 631 / 67 / 245 but they are NOT a pair: floor(631/8) = 78, not -495. If this is nether, the overworld side is ~ -3960 / -3152. Visit it and confirm the dimension (PRD Q1).",
  },
  {
    id: "loc_005", name: "Unlabelled 2411", dimension: "overworld",
    x: 2411, y: 22, z: -326, type: "misc",
    tags: ["needs-review"],
    notes: "NEEDS REVIEW - no label in the original notes. Y = 22 suggests a cave or mine. Visit and name it (PRD Q2).",
  },
  {
    id: "loc_006", name: "Desert Red Cave", dimension: "overworld",
    x: 2225, y: 63, z: -3552, type: "biome",
    tags: ["desert", "cave"],
  },
  {
    id: "loc_007", name: "Jungle Biome", dimension: "overworld",
    x: 2000, y: 62, z: -2000, type: "biome",

  },
  {
    id: "loc_008", name: "Shipwreck (north)", dimension: "overworld",
    x: 936, y: 62, z: -501, type: "shipwreck",

  },
  {
    id: "loc_009", name: "Shipwreck (near monument)", dimension: "overworld",
    x: 823, y: 62, z: -271, type: "shipwreck",
    tags: ["loot"],
    notes: "Ocean monument nearby - get exact coordinates next visit (PRD Q4). This note is the only way the monument is currently findable, which is why search must cover notes.",
  },
  {
    id: "loc_010", name: "Zombie Spawner A", dimension: "overworld",
    x: 97, y: -19, z: 468, type: "spawner",
    tags: ["zombie", "farm-candidate"],
  },
  {
    id: "loc_011", name: "Zombie Spawner B", dimension: "overworld",
    x: 105, y: -49, z: 256, type: "spawner",
    tags: ["zombie", "farm-candidate"],
  },
  {
    id: "loc_012", name: "Spider Spawner", dimension: "overworld",
    x: 91, y: -13, z: 200, type: "spawner",
    tags: ["spider", "farm-candidate", "cobweb"],
    notes: "Cobweb source for Potion of Weaving.",
  },
  {
    id: "loc_013", name: "Bastion Portal (Overworld side)", dimension: "overworld",
    x: 688, y: 69, z: -1926, type: "portal",
    tags: ["bastion"],
    notes: "Scales to nether 86 / -241. NOTE: BUILD_PLAN said -240; floor(-1926/8) = floor(-240.75) = -241. Math.floor, not truncation. No link conflicts - nearest nether portal is 287.7 blocks away. Nether-side portal not yet recorded.",
  },
  {
    id: "loc_014", name: "Trial Chamber Portal (Overworld)", dimension: "overworld",
    x: 2217, y: -5, z: -4024, type: "portal",
    tags: ["trial-chamber", "breeze"], favorite: true,
    linkedPortalId: "loc_015",
    notes: "Scales to nether 277 / -503. Paired with Fortress Portal (Nether). Forward 4.12 blocks (tight), backward 33.24 blocks (loose). Overall health: LOOSE - a new overworld portal within 128 blocks of 2208 / -4056 would steal the return trip.",
  },
  {
    id: "loc_015", name: "Fortress Portal (Nether)", dimension: "nether",
    x: 276, y: 45, z: -507, type: "portal",
    tags: ["fortress", "blaze"], favorite: true,
    linkedPortalId: "loc_014",
    notes: "Scales to overworld 2208 / -4056. Paired with Trial Chamber Portal. VERIFIED GOOD PAIR - links correctly in both directions. Blaze rod source.",
  },
];


/* ==========================================================================
   STATE
   `data` is persisted. `ui` is never persisted — restoring a stale filter on
   launch would silently hide locations. docs/02-TRD.md §3.3
   ========================================================================== */

const boot = buildInitialData(SEED_LOCATIONS);

let state = {
  data: boot.data,
  ui: {
    activeTab:      "coordinates",   // coordinates | portals | brewing | reference
    search:         "",
    filters:        { dimension: null, type: null },
    sort:           "updated",       // name | type | updated
    editingId:      null,
    modal:          null,
    recentlyViewed: [],
  },
};

/** Locations of the active world. */
function activeLocations() {
  const w = state.data.worlds.find(w => w.id === state.data.settings.activeWorldId)
         ?? state.data.worlds[0];
  return w.locations;
}


/* ==========================================================================
   PHASE 1 GATE — docs/06-IMPLEMENTATION-PLAN.md
   "the console prints all 15 locations, every one with all 13 fields present,
    and the Trial ↔ Fortress link is symmetric in both directions."
   ========================================================================== */

(function reportPhase1() {
  const locs = activeLocations();
  const lines = [];

  lines.push(`locations: ${locs.length}`);

  const missing = locs.flatMap(l =>
    LOCATION_FIELDS.filter(f => !(f in l)).map(f => `${l.id}.${f}`)
  );
  lines.push(`all 13 fields present: ${missing.length === 0 ? "yes" : "NO — missing " + missing.join(", ")}`);

  const byId = new Map(locs.map(l => [l.id, l]));
  const linked = locs.filter(l => l.linkedPortalId);
  const asymmetric = linked.filter(l => byId.get(l.linkedPortalId)?.linkedPortalId !== l.id);
  lines.push(`portal links: ${linked.length} (${asymmetric.length === 0 ? "all symmetric" : "ASYMMETRIC: " + asymmetric.map(l => l.id).join(", ")})`);

  const portals = locs.filter(l => l.type === "portal");
  lines.push(`portals: ${portals.length}   favourites: ${locs.filter(l => l.favorite).length}`);

  if (boot.repairs.length) lines.push(`repairs: ${boot.repairs.join(" · ")}`);

  document.getElementById("boot").textContent = lines.join("\n");

  console.log("%cBlockBook — Phase 1", "font-weight:bold");
  lines.forEach(l => console.log(l));
  console.table(locs, LOCATION_FIELDS);
  console.log("full state.data:", state.data);
})();
</script>
