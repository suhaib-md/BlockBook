<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlockBook</title>
  <style>
  /* ==========================================================================
     DESIGN TOKENS — docs/04-UIUX-SPEC.md §2
     Declared once. Never hard-code a colour anywhere below this block.
     ========================================================================== */
  :root {
    /* Surfaces (dark, default) */
    --bg-0: #0e1116;  --bg-1: #161b22;  --bg-2: #21262d;  --bg-3: #30363d;
    /* Text */
    --fg-0: #e6edf3;  --fg-1: #9198a1;  --fg-2: #6e7681;
    /* Dimension identity */
    --ow: #3fb950;      --ow-bg: #12261a;
    --nether: #f85149;  --nether-bg: #2d1416;
    --end: #bc8cff;     --end-bg: #21182f;
    /* Status */
    --ok: #3fb950;  --warn: #d29922;  --bad: #f85149;  --info: #58a6ff;
    /* Type */
    --font-ui: "Segoe UI", system-ui, sans-serif;
    --font-mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;
    /* Space (4px scale) */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
    /* Shape */
    --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
    --border: 1px solid var(--bg-3);
    --shadow: 0 8px 24px rgba(0,0,0,.4);
    /* Motion — docs/04-UIUX-SPEC.md §5. Durations are tokens so the
       reduced-motion override can zero them without needing !important. */
    --motion-hover: 80ms;
    --motion-modal: 120ms;
    --motion-panel: 140ms;
    --motion-toast: 150ms;
  }

  @media (prefers-reduced-motion: reduce) {
    :root {
      --motion-hover: 0ms;
      --motion-modal: 0ms;
      --motion-panel: 0ms;
      --motion-toast: 0ms;
    }
  }

  :root[data-theme="light"] {
    --bg-0: #ffffff;  --bg-1: #f6f8fa;  --bg-2: #eaeef2;  --bg-3: #d0d7de;
    --fg-0: #1f2328;  --fg-1: #59636e;  --fg-2: #818b98;
    --ow: #1a7f37;      --ow-bg: #dafbe1;
    --nether: #cf222e;  --nether-bg: #ffebe9;
    --end: #8250df;     --end-bg: #fbefff;
    --ok: #1a7f37;  --warn: #9a6700;  --bad: #cf222e;  --info: #0969da;
    --shadow: 0 8px 24px rgba(0,0,0,.12);
  }

  /* ==========================================================================
     LAYOUT — docs/04-UIUX-SPEC.md §3
     ========================================================================== */
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg-0);
    color: var(--fg-0);
    font-family: var(--font-ui);
    font-size: var(--fs-md);
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- top bar ---- */
  .topbar {
    height: 48px;
    flex: 0 0 48px;
    display: flex;
    align-items: center;
    gap: var(--s-4);
    padding: 0 var(--s-4);
    background: var(--bg-1);
    border-bottom: var(--border);
  }
  .brand {
    font-weight: 600;
    font-size: var(--fs-md);
    white-space: nowrap;
  }
  .tabs { display: flex; gap: var(--s-1); flex: 1; }
  .tab {
    background: none;
    border: none;
    color: var(--fg-1);
    font: inherit;
    padding: var(--s-1) var(--s-3);
    border-radius: var(--r-sm);
    cursor: pointer;
  }
  .tab:hover { background: var(--bg-2); color: var(--fg-0); }
  .tab[aria-selected="true"] {
    background: var(--bg-2);
    color: var(--fg-0);
    box-shadow: inset 0 -2px 0 var(--info);
  }
  .icon-btn {
    background: none;
    border: none;
    color: var(--fg-1);
    font-size: var(--fs-lg);
    cursor: pointer;
    padding: var(--s-1) var(--s-2);
    border-radius: var(--r-sm);
  }
  .icon-btn:hover { background: var(--bg-2); color: var(--fg-0); }

  /* ---- toolbar ---- */
  .toolbar {
    flex: 0 0 auto;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-2) var(--s-4);
    border-bottom: var(--border);
    background: var(--bg-0);
  }
  .toolbar label { color: var(--fg-1); font-size: var(--fs-sm); }
  .toolbar-rows { display: flex; flex-direction: column; gap: var(--s-2); width: 100%; }
  .toolbar-row { display: flex; align-items: center; gap: var(--s-2); }

  input[type="text"], input[type="number"], textarea {
    background: var(--bg-2);
    color: var(--fg-0);
    border: var(--border);
    border-radius: var(--r-sm);
    font: inherit;
    font-size: var(--fs-md);
    padding: var(--s-1) var(--s-2);
    width: 100%;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--info);
    outline-offset: 2px;
  }
  .search-wrap { flex: 1; position: relative; display: flex; align-items: center; }
  .search-wrap .glass {
    position: absolute; left: var(--s-2); color: var(--fg-2);
    font-size: var(--fs-sm); pointer-events: none;
  }
  #search { padding-left: 28px; }
  .btn {
    background: var(--bg-2);
    color: var(--fg-0);
    border: var(--border);
    border-radius: var(--r-sm);
    font: inherit;
    font-size: var(--fs-sm);
    padding: var(--s-1) var(--s-3);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-3); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--info); border-color: var(--info); color: #06121f; font-weight: 600; }
  .btn.danger  { color: var(--bad); border-color: var(--bad); }
  .btn.ghost   { background: none; }

  /* filter chips — docs/04-UIUX-SPEC.md §4.6 */
  .chips { display: flex; gap: var(--s-1); }
  .fchip {
    background: none;
    border: var(--border);
    border-radius: var(--r-sm);
    color: var(--fg-1);
    font: inherit;
    font-size: var(--fs-sm);
    padding: 2px var(--s-2);
    cursor: pointer;
  }
  .fchip:hover { color: var(--fg-0); }
  .fchip[aria-pressed="true"] { color: var(--fg-0); }
  .fchip[aria-pressed="true"][data-dim="overworld"] { background: var(--ow-bg);     border-color: var(--ow); }
  .fchip[aria-pressed="true"][data-dim="nether"]    { background: var(--nether-bg); border-color: var(--nether); }
  .fchip[aria-pressed="true"][data-dim="end"]       { background: var(--end-bg);    border-color: var(--end); }
  .fchip[aria-pressed="true"][data-dim=""]          { background: var(--bg-2);      border-color: var(--fg-2); }

  select {
    background: var(--bg-2);
    color: var(--fg-0);
    border: var(--border);
    border-radius: var(--r-sm);
    font: inherit;
    font-size: var(--fs-sm);
    padding: var(--s-1) var(--s-2);
  }
  .spacer { flex: 1; }
  .count { color: var(--fg-1); font-size: var(--fs-sm); }

  /* ---- main panel ---- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: var(--s-3) var(--s-4);
  }

  .section-label {
    font-size: var(--fs-xs);
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--fg-2);
    margin: var(--s-2) 0 var(--s-2);
  }

  /* ---- location card — docs/04-UIUX-SPEC.md §4.1 ---- */
  .list { display: flex; flex-direction: column; gap: var(--s-1); }

  .card {
    background: var(--bg-1);
    border: var(--border);
    border-left: 3px solid transparent;
    border-radius: var(--r-md);
    padding: var(--s-2) var(--s-3);
    transition: background var(--motion-hover) linear;
  }
  .card:hover { background: var(--bg-2); }
  .card.is-favorite { border-left-color: var(--warn); }

  .card-main {
    display: flex;
    align-items: center;
    gap: var(--s-3);
  }
  .card-icon { font-size: var(--fs-lg); line-height: 1; flex: 0 0 auto; }
  .card-name {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .coord {
    font-family: var(--font-mono);
    font-size: var(--fs-md);
    color: var(--fg-0);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .coord .nil { color: var(--fg-2); }

  /* ---- dimension badge — docs/04-UIUX-SPEC.md §4.2 ---- */
  .badge {
    font-size: var(--fs-xs);
    letter-spacing: .5px;
    padding: 2px 6px;
    border-radius: var(--r-sm);
    text-transform: uppercase;
    flex: 0 0 auto;
    min-width: 30px;
    text-align: center;
  }
  .badge.overworld { color: var(--ow);     background: var(--ow-bg); }
  .badge.nether    { color: var(--nether); background: var(--nether-bg); }
  .badge.end       { color: var(--end);    background: var(--end-bg); }

  /* ---- tag chips ---- */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s-1);
    margin: var(--s-1) 0 0 calc(var(--fs-lg) + var(--s-3));
  }
  .chip {
    font-size: var(--fs-xs);
    color: var(--fg-1);
    background: var(--bg-2);
    border-radius: var(--r-sm);
    padding: 1px 6px;
  }

  .card-actions { display: flex; gap: var(--s-1); flex: 0 0 auto; }
  .card-actions .btn { padding: 1px var(--s-2); font-size: var(--fs-xs); }

  .note-preview {
    margin: var(--s-1) 0 0 calc(var(--fs-lg) + var(--s-3));
    font-size: var(--fs-sm);
    color: var(--fg-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- portal widgets — docs/04-UIUX-SPEC.md §4.4, §4.8 ---- */
  .portal-row {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    flex-wrap: wrap;
    margin: var(--s-1) 0 0 calc(var(--fs-lg) + var(--s-3));
    font-size: var(--fs-sm);
  }
  .muted { color: var(--fg-2); }
  .health { font-size: var(--fs-sm); white-space: nowrap; }
  .health.ok    { color: var(--ok); }
  .health.warn  { color: var(--warn); }
  .health.bad   { color: var(--bad); }
  .health.muted { color: var(--fg-2); }

  .converter {
    display: flex;
    align-items: stretch;
    gap: var(--s-3);
    margin-bottom: var(--s-2);
  }
  .conv-side {
    flex: 1;
    background: var(--bg-1);
    border: var(--border);
    border-radius: var(--r-md);
    padding: var(--s-3);
  }
  .conv-side.ow { border-color: color-mix(in srgb, var(--ow) 35%, var(--bg-3)); }
  .conv-side.ne { border-color: color-mix(in srgb, var(--nether) 35%, var(--bg-3)); }
  .conv-title {
    display: flex; align-items: center; gap: var(--s-2);
    font-size: var(--fs-sm); color: var(--fg-1);
    margin-bottom: var(--s-2);
  }
  .conv-side label {
    display: flex; align-items: center; gap: var(--s-2);
    color: var(--fg-1); font-size: var(--fs-sm);
    margin-bottom: var(--s-2);
  }
  .conv-side input {
    font-family: var(--font-mono);
    font-size: var(--fs-xl);
    font-variant-numeric: tabular-nums;
    padding: var(--s-1) var(--s-2);
  }
  .conv-arrow {
    display: flex; align-items: center;
    color: var(--fg-2); font-size: var(--fs-xl);
  }
  .conv-note {
    color: var(--fg-2);
    font-size: var(--fs-sm);
    margin: 0 0 var(--s-4);
  }

  .verdict {
    border-radius: var(--r-md);
    padding: var(--s-2) var(--s-3);
    font-size: var(--fs-sm);
    border-left: 3px solid transparent;
  }
  .verdict.ok   { background: var(--ow-bg);     border-left-color: var(--ok);   color: var(--fg-0); }
  .verdict.warn { background: color-mix(in srgb, var(--warn) 12%, transparent);
                  border-left-color: var(--warn); color: var(--fg-0); }
  .verdict-actions { display: flex; gap: var(--s-2); margin-top: var(--s-2); }

  .portal-panel {
    border-top: var(--border);
    padding-top: var(--s-3);
    margin-top: var(--s-3);
  }
  .cp-line {
    font-size: var(--fs-sm);
    color: var(--fg-1);
    margin-bottom: var(--s-2);
  }

  /* ---- empty states — docs/04-UIUX-SPEC.md §6 ---- */
  .empty {
    text-align: center;
    color: var(--fg-1);
    padding: var(--s-6) var(--s-4);
  }
  .empty .glyph { font-size: 28px; display: block; margin-bottom: var(--s-2); }
  .empty .btn { margin-top: var(--s-3); }

  /* ---- banner — docs/04-UIUX-SPEC.md §4.12 ---- */
  .banner {
    padding: var(--s-2) var(--s-4);
    background: var(--nether-bg);
    border-left: 3px solid var(--bad);
    border-bottom: var(--border);
    color: var(--fg-0);
    font-size: var(--fs-sm);
  }
  .banner code { font-family: var(--font-mono); color: var(--fg-1); }

  /* ---- modal — docs/04-UIUX-SPEC.md §4.7 ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    padding: var(--s-4);
    z-index: 50;
  }
  .modal {
    background: var(--bg-1);
    border: var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    animation: pop var(--motion-modal) ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .modal-head {
    display: flex; align-items: center;
    padding: var(--s-3) var(--s-4);
    border-bottom: var(--border);
  }
  .modal-head h2 { margin: 0; font-size: var(--fs-md); flex: 1; }
  .modal-body { padding: var(--s-4); overflow-y: auto; }
  .modal-foot {
    display: flex; gap: var(--s-2); justify-content: flex-end;
    padding: var(--s-3) var(--s-4);
    border-top: var(--border);
  }
  .field { margin-bottom: var(--s-3); }
  .field > label {
    display: block;
    font-size: var(--fs-sm);
    color: var(--fg-1);
    margin-bottom: var(--s-1);
  }
  .req { color: var(--warn); }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s-2); }
  .radios { display: flex; gap: var(--s-2); }
  .radios label {
    flex: 1;
    display: flex; align-items: center; gap: var(--s-1);
    justify-content: center;
    border: var(--border);
    border-radius: var(--r-sm);
    padding: var(--s-1) var(--s-2);
    cursor: pointer;
    font-size: var(--fs-sm);
    color: var(--fg-1);
  }
  .radios label:has(input:checked) { color: var(--fg-0); border-color: var(--info); background: var(--bg-2); }
  .hint { font-size: var(--fs-xs); color: var(--fg-2); margin-top: var(--s-1); }
  .hint.warn { color: var(--warn); }
  .msg-list { list-style: none; margin: 0 0 var(--s-3); padding: 0; font-size: var(--fs-sm); }
  .msg-list li { padding: var(--s-1) 0; }
  .msg-list li.err  { color: var(--bad); }
  .msg-list li.warn { color: var(--warn); }
  .checkline { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-sm); color: var(--fg-1); }

  /* ---- import review table — docs/04-UIUX-SPEC.md §4.9 ---- */
  table.review {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--fs-sm);
  }
  table.review th {
    text-align: left;
    color: var(--fg-2);
    font-weight: 500;
    font-size: var(--fs-xs);
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: var(--s-1) var(--s-2);
    border-bottom: var(--border);
  }
  table.review td {
    padding: 2px var(--s-2);
    border-bottom: 1px solid color-mix(in srgb, var(--bg-3) 50%, transparent);
  }
  table.review td.coord { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  table.review input[type="text"], table.review select { font-size: var(--fs-sm); padding: 1px var(--s-1); }
  table.review tr.row-off { opacity: .45; }
  table.review select.needs { border-color: var(--warn); color: var(--warn); }
  table.review select.guessed-sel { color: var(--warn); }
  sup.guessed { color: var(--warn); font-size: 9px; margin-left: 2px; }

  textarea#import-text {
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    resize: vertical;
  }

  /* ---- toast — docs/04-UIUX-SPEC.md §4.11 ---- */
  .toast {
    position: fixed;
    right: var(--s-4);
    bottom: var(--s-5);
    background: var(--bg-2);
    border: var(--border);
    border-radius: var(--r-md);
    box-shadow: var(--shadow);
    padding: var(--s-2) var(--s-3);
    font-size: var(--fs-sm);
    z-index: 60;
    animation: pop var(--motion-toast) ease-out;
  }

  /* ---- stub panels — docs/04-UIUX-SPEC.md §6 ---- */
  .stub {
    max-width: 520px;
    margin: var(--s-6) auto;
    text-align: center;
    color: var(--fg-1);
  }
  .stub .glyph { font-size: 32px; display: block; margin-bottom: var(--s-3); }
  .stub h2 { font-size: var(--fs-lg); color: var(--fg-0); margin: 0 0 var(--s-2); }
  .stub ul {
    text-align: left;
    display: inline-block;
    font-size: var(--fs-sm);
    color: var(--fg-2);
    margin: var(--s-3) 0 0;
  }

  /* ---- status bar ---- */
  .statusbar {
    flex: 0 0 26px;
    height: 26px;
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: 0 var(--s-4);
    background: var(--bg-1);
    border-top: var(--border);
    color: var(--fg-1);
    font-size: var(--fs-xs);
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">&#9935; BlockBook</div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button class="icon-btn" data-act="settings" title="Settings">&#9881;</button>
  </header>
  <input type="file" id="file-input" accept="application/json,.json" hidden>

  <div id="banner"></div>
  <div class="toolbar" id="toolbar"></div>
  <main id="panel"></main>
  <footer class="statusbar" id="statusbar"></footer>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

<script>
/* ==========================================================================
   BlockBook — single-file app (v0.x)
   Docs: ./docs/  ·  Schema contract: docs/05-DATA-SCHEMA.md
   Build order: docs/06-IMPLEMENTATION-PLAN.md
   ========================================================================== */

/* ── BLOCKBOOK LOGIC START ─────────────────────────────────────────────────
   Everything between these fences is PURE: no DOM, no state, no storage.
   The Phase 4 golden-case harness extracts and evaluates this region
   directly out of this file, so the tests can never drift from the app.
   Do not reference `state`, `document`, or `localStorage` in here.
   ────────────────────────────────────────────────────────────────────────── */

/**
 * @typedef {"overworld"|"nether"|"end"} Dimension
 *
 * @typedef {"base"|"portal"|"spawner"|"structure"|"biome"|"mine"|"farm"
 *          |"village"|"stronghold"|"fortress"|"bastion"|"monument"
 *          |"shipwreck"|"trial_chamber"|"misc"} LocationType
 *
 * @typedef {Object} Location
 * @property {string}       id              Stable, never reused
 * @property {string}       name            1-80 chars, required
 * @property {Dimension}    dimension       REQUIRED, never defaulted
 * @property {number}       x               Integer
 * @property {number|null}  y               Integer, or null for "don't care"
 * @property {number}       z               Integer
 * @property {LocationType} type            Defaults to "misc"
 * @property {string[]}     tags            Lowercase, deduped
 * @property {string}       notes           Free text, searchable
 * @property {string|null}  linkedPortalId  Portal pairing; symmetric
 * @property {boolean}      favorite
 * @property {string}       createdAt       ISO 8601 UTC
 * @property {string}       updatedAt       ISO 8601 UTC
 *
 * @typedef {Object} World
 * @property {string}     id
 * @property {string}     name
 * @property {"java"|"bedrock"} edition
 * @property {string}     gameVersion
 * @property {string|null} seed            STRING - 64-bit, do not parse as number
 * @property {string}     createdAt
 * @property {Location[]} locations
 *
 * @typedef {Object} Settings
 * @property {string}  activeWorldId
 * @property {string}  coordFormat
 * @property {boolean} alwaysOnTop
 * @property {string}  hotkey
 * @property {"dark"|"light"} theme
 *
 * @typedef {Object} BlockBookData
 * @property {number}   schemaVersion
 * @property {"blockbook"} app
 * @property {World[]}  worlds
 * @property {Settings} settings
 */

const SCHEMA_VERSION = 1;

/** The 13 fields every Location carries. Order is the schema's order. */
const LOCATION_FIELDS = [
  "id", "name", "dimension", "x", "y", "z", "type",
  "tags", "notes", "linkedPortalId", "favorite", "createdAt", "updatedAt"
];

/** @type {Dimension[]} */
const DIMENSIONS = ["overworld", "nether", "end"];

/** @type {LocationType[]} */
const LOCATION_TYPES = [
  "base", "portal", "spawner", "structure", "biome", "mine", "farm",
  "village", "stronghold", "fortress", "bastion", "monument",
  "shipwreck", "trial_chamber", "misc"
];

/** Y validation ranges, inclusive. docs/05-DATA-SCHEMA.md §4.2 */
const Y_RANGES = {
  overworld: [-64, 320],
  nether:    [0, 127],
  end:       [0, 255],
};

const DEFAULT_SETTINGS = {
  activeWorldId: "w_main",
  coordFormat:   "x / y / z",
  alwaysOnTop:   true,
  hotkey:        "Ctrl+Space",
  theme:         "dark",
};

/** Normalise tags: lowercase, trimmed, deduped, empties dropped. */
function normaliseTags(tags) {
  if (!Array.isArray(tags)) return [];
  const seen = new Set();
  for (const t of tags) {
    const v = String(t).trim().toLowerCase();
    if (v) seen.add(v);
  }
  return [...seen];
}

/**
 * Expand a partial seed row into a complete Location with all 13 fields.
 * Every required field is written explicitly — a missing key means a malformed
 * file, so the app never has to probe for `undefined`. docs/05-DATA-SCHEMA.md §4
 *
 * `dimension` is deliberately NOT defaulted: an absent dimension is preserved as
 * undefined so validation catches it, rather than being silently guessed.
 */
function normaliseLocation(raw, i, now) {
  return {
    id:             raw.id ?? `loc_${String(i + 1).padStart(3, "0")}`,
    name:           String(raw.name ?? "").trim(),
    dimension:      raw.dimension,
    x:              Math.floor(Number(raw.x)),
    y:              raw.y == null ? null : Math.floor(Number(raw.y)),
    z:              Math.floor(Number(raw.z)),
    type:           LOCATION_TYPES.includes(raw.type) ? raw.type : "misc",
    tags:           normaliseTags(raw.tags),
    notes:          String(raw.notes ?? ""),
    linkedPortalId: raw.linkedPortalId ?? null,
    favorite:       Boolean(raw.favorite),
    createdAt:      raw.createdAt ?? now,
    updatedAt:      raw.updatedAt ?? now,
  };
}

/**
 * Enforce the four linkedPortalId invariants and make every link symmetric.
 * docs/05-DATA-SCHEMA.md §4.4
 *
 * I1 set only when type === "portal"
 * I2 the target must exist
 * I3 the target must also be a portal
 * I4 the target must be in a DIFFERENT dimension
 * plus: a one-sided link is repaired by writing the reverse side.
 *
 * @returns {string[]} human-readable repairs made, for logging
 */
function repairPortalLinks(locations) {
  const byId = new Map(locations.map(l => [l.id, l]));
  const repairs = [];

  for (const loc of locations) {
    if (loc.linkedPortalId == null) continue;

    const drop = (why) => {
      repairs.push(`cleared link on "${loc.name}" — ${why}`);
      loc.linkedPortalId = null;
    };

    if (loc.type !== "portal")        { drop("I1: not a portal"); continue; }
    const target = byId.get(loc.linkedPortalId);
    if (!target)                      { drop("I2: target does not exist"); continue; }
    if (target.type !== "portal")     { drop("I3: target is not a portal"); continue; }
    if (target.dimension === loc.dimension) { drop("I4: target is in the same dimension"); continue; }

    // End portals never participate in pairing — no scaling relationship exists.
    if (loc.dimension === "end" || target.dimension === "end") {
      drop("End portals cannot be paired");
      continue;
    }
  }

  // Second pass: repair one-sided links now that invalid ones are gone.
  for (const loc of locations) {
    if (loc.linkedPortalId == null) continue;
    const target = byId.get(loc.linkedPortalId);
    if (target && target.linkedPortalId !== loc.id) {
      repairs.push(`made link symmetric: "${target.name}" → "${loc.name}"`);
      target.linkedPortalId = loc.id;
    }
  }

  return repairs;
}

/**
 * Build the full root document from a bare array of seed rows.
 * @param {Partial<Location>[]} seedLocations
 * @returns {{ data: BlockBookData, repairs: string[] }}
 */
function buildInitialData(seedLocations, now = new Date().toISOString()) {
  const locations = seedLocations.map((raw, i) => normaliseLocation(raw, i, now));
  const repairs = repairPortalLinks(locations);

  return {
    data: {
      schemaVersion: SCHEMA_VERSION,
      app: "blockbook",
      worlds: [{
        id:          "w_main",
        name:        "Survival World",
        edition:     "java",
        gameVersion: "1.21",
        seed:        null,          // STRING or null — never a JS number
        createdAt:   now,
        locations,
      }],
      settings: { ...DEFAULT_SETTINGS },
    },
    repairs,
  };
}

/** World border, in blocks, on the X and Z axes. */
const WORLD_BORDER = 30000000;

/* --------------------------------------------------------------------------
   PORTAL MATHS — docs/07-ALGORITHMS.md §§2–4
   -------------------------------------------------------------------------- */

/**
 * Horizontal blocks searched for an existing portal in the DESTINATION
 * dimension. Because it is measured in destination-dimension blocks, the two
 * traversal directions have very different reach:
 *   overworld -> nether : 128 nether blocks    (= 1024 overworld blocks)
 *   nether -> overworld : 128 overworld blocks (=   16 nether blocks)
 * That asymmetry is why nether hubs work, and why overworld portals built a
 * few hundred blocks apart silently merge.
 */
const LINK_RADIUS = 128;

/**
 * Overworld -> Nether.
 *
 * Y IS DELIBERATELY ABSENT FROM THE SIGNATURE (ADR-006). Only X and Z scale.
 * Making Y unpassable means it cannot be scaled by accident — the single most
 * common bug in this class of tool, and one that yields plausible wrong answers.
 *
 * Math.floor, never Math.trunc: for negative coordinates trunc rounds toward
 * zero and is off by one. floor(-1926/8) = -241; trunc gives -240.
 */
const toNether = (x, z) => ({ x: Math.floor(x / 8), z: Math.floor(z / 8) });

/** Nether -> Overworld. */
const toOverworld = (x, z) => ({ x: x * 8, z: z * 8 });

const horizontalDistance = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

/** The dimension a portal links into. The End links nowhere. */
function destinationDimension(dim) {
  if (dim === "overworld") return "nether";
  if (dim === "nether")    return "overworld";
  return null;
}

/**
 * Where a portal lands in the other dimension.
 * @returns {{dimension, x, z}|null} null for the End, which has no scaling.
 */
function counterpart(loc) {
  const dest = destinationDimension(loc.dimension);
  if (!dest || !Number.isInteger(loc.x) || !Number.isInteger(loc.z)) return null;
  const p = loc.dimension === "overworld"
    ? toNether(loc.x, loc.z)
    : toOverworld(loc.x, loc.z);
  return { dimension: dest, x: p.x, z: p.z };
}

/**
 * Existing portals that would hijack the link for a proposed portal.
 * docs/07-ALGORITHMS.md §3.2
 * @returns {{location, distance}[]} nearest first
 */
function findLinkConflicts(candidate, all) {
  const target = counterpart(candidate);
  if (!target) return [];                       // End, or incomplete coordinates

  return all
    .filter(l => l.type === "portal"
              && l.dimension === target.dimension
              && l.id !== candidate.id          // never conflict with itself
              && Number.isInteger(l.x) && Number.isInteger(l.z))
    .map(l => ({ location: l, distance: horizontalDistance(target, l) }))
    .filter(r => r.distance <= LINK_RADIUS)
    .sort((a, b) => a.distance - b.distance);
}

/**
 * Health of an existing pair, measured in BOTH directions.
 * docs/07-ALGORITHMS.md §4 · ADR-010
 *
 * A pair is only truly connected if both traversals land on the intended
 * portal, and the two directions have different tolerances (see LINK_RADIUS).
 * Report the worse one: a pair that works one way and not the other is broken
 * in the way that matters — you walk through and cannot get back.
 *
 * @returns {{forward, backward, worst, status}|null}
 */
function linkHealth(a, b) {
  if (!a || !b) return null;
  if (a.dimension === b.dimension) return null;
  if (a.dimension === "end" || b.dimension === "end") return null;
  if (![a, b].every(l => Number.isInteger(l.x) && Number.isInteger(l.z))) return null;

  const ow = a.dimension === "overworld" ? a : b;
  const ne = a.dimension === "overworld" ? b : a;

  // overworld -> nether, measured in NETHER blocks
  const forward  = horizontalDistance(toNether(ow.x, ow.z), ne);
  // nether -> overworld, measured in OVERWORLD blocks
  const backward = horizontalDistance(toOverworld(ne.x, ne.z), ow);

  const worst = Math.max(forward, backward);
  const status = worst <= 16 ? "tight" : worst <= LINK_RADIUS ? "loose" : "broken";
  return { forward, backward, worst, status };
}

/** One decimal place, without a trailing ".0" on whole numbers. */
function fmtDist(d) {
  return Number.isInteger(d) ? String(d) : d.toFixed(1);
}

/**
 * Portal-specific warnings W2 and W4, injected into validateLocation().
 * docs/05-DATA-SCHEMA.md §7
 */
function portalWarnings(loc, all) {
  const out = [];
  if (loc.type !== "portal") return out;
  if (!destinationDimension(loc.dimension)) return out;
  if (!Number.isInteger(loc.x) || !Number.isInteger(loc.z)) return out;

  // W2 — a portal that is NOT the chosen partner sitting inside the radius.
  // The chosen partner being nearby is the desired outcome, not a conflict.
  const hijackers = findLinkConflicts(loc, all)
    .filter(c => c.location.id !== loc.linkedPortalId);
  if (hijackers.length) {
    const n = hijackers[0];
    out.push({
      code: "W2", field: "x",
      msg: `Will likely link to “${n.location.name}” (${fmtDist(n.distance)} blocks away).`,
    });
  }

  // W4 — health of the pair that has actually been declared.
  const partner = loc.linkedPortalId ? all.find(l => l.id === loc.linkedPortalId) : null;
  const h = linkHealth(loc, partner);
  if (h && h.status === "loose") {
    out.push({ code: "W4", field: "linkedPortalId",
      msg: `This pair is ${fmtDist(h.worst)} blocks apart — another portal could steal the link.` });
  }
  if (h && h.status === "broken") {
    out.push({ code: "W4", field: "linkedPortalId",
      msg: `This pair is ${fmtDist(h.worst)} blocks apart — these two do NOT link to each other.` });
  }

  return out;
}

/** Portals whose declared pair does not actually connect. Surfaced prominently. */
function brokenPairs(all) {
  const seen = new Set();
  const out = [];
  for (const loc of all) {
    if (loc.type !== "portal" || !loc.linkedPortalId) continue;
    const key = [loc.id, loc.linkedPortalId].sort().join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    const h = linkHealth(loc, all.find(l => l.id === loc.linkedPortalId));
    if (h?.status === "broken") out.push({ a: loc, b: all.find(l => l.id === loc.linkedPortalId), health: h });
  }
  return out;
}

/**
 * Types that only plausibly exist in certain dimensions. Drives warning W6,
 * which is advisory only — the player may be recording something unusual.
 */
const TYPE_DIMENSIONS = {
  fortress:      ["nether"],
  bastion:       ["nether"],
  village:       ["overworld"],
  monument:      ["overworld"],
  shipwreck:     ["overworld"],
  stronghold:    ["overworld"],
  trial_chamber: ["overworld"],
};

/**
 * Validate a location. docs/05-DATA-SCHEMA.md §7
 * Errors block the save; warnings never do — the player may know something the
 * validator does not.
 *
 * W2 (portal link conflict) and W4 (pair health) need portal maths and arrive
 * in Phase 4; `extraWarnings` is where they get injected.
 *
 * @returns {{errors: {code,field,msg}[], warnings: {code,field,msg}[]}}
 */
function validateLocation(loc, all = [], extraWarnings = []) {
  const errors = [];
  const warnings = [];
  const others = all.filter(l => l.id !== loc.id);
  const name = String(loc.name ?? "").trim();

  // ---- errors ----
  if (!name) {
    errors.push({ code: "E1", field: "name", msg: "Name is required." });
  } else if (name.length > 80) {
    errors.push({ code: "E1", field: "name", msg: "Name must be 80 characters or fewer." });
  }

  if (!DIMENSIONS.includes(loc.dimension)) {
    errors.push({ code: "E2", field: "dimension", msg: "Choose a dimension." });
  }

  if (!Number.isInteger(loc.x) || !Number.isInteger(loc.z)) {
    errors.push({ code: "E3", field: "x", msg: "X and Z must be whole numbers." });
  }

  if (!(loc.y === null || Number.isInteger(loc.y))) {
    errors.push({ code: "E4", field: "y", msg: "Y must be a whole number, or left blank." });
  }

  if ((Number.isInteger(loc.x) && Math.abs(loc.x) > WORLD_BORDER) ||
      (Number.isInteger(loc.z) && Math.abs(loc.z) > WORLD_BORDER)) {
    errors.push({ code: "E5", field: "x", msg: "Coordinate outside the world border." });
  }

  if (!LOCATION_TYPES.includes(loc.type)) {
    errors.push({ code: "E6", field: "type", msg: "Unknown location type." });
  }

  if (loc.linkedPortalId != null) {
    const target = others.find(l => l.id === loc.linkedPortalId);
    const ok = loc.type === "portal"
            && target
            && target.type === "portal"
            && target.dimension !== loc.dimension
            && loc.dimension !== "end"
            && target.dimension !== "end";
    if (!ok) {
      errors.push({ code: "E7", field: "linkedPortalId", msg: "That portal cannot be linked." });
    }
  }

  // ---- warnings ----
  if (DIMENSIONS.includes(loc.dimension) && Number.isInteger(loc.y)) {
    const [min, max] = Y_RANGES[loc.dimension];
    if (loc.y < min || loc.y > max) {
      warnings.push({
        code: "W1", field: "y",
        msg: `Y ${loc.y} is outside the ${loc.dimension} range (${min} to ${max}).`,
      });
    }
  }

  if (loc.type === "portal" && loc.linkedPortalId == null && loc.dimension !== "end") {
    warnings.push({ code: "W3", field: "linkedPortalId", msg: "No partner portal recorded." });
  }

  if (name && others.some(l => l.name.trim().toLowerCase() === name.toLowerCase())) {
    warnings.push({ code: "W5", field: "name", msg: `Another location is also called “${name}”.` });
  }

  const allowed = TYPE_DIMENSIONS[loc.type];
  if (allowed && DIMENSIONS.includes(loc.dimension) && !allowed.includes(loc.dimension)) {
    warnings.push({
      code: "W6", field: "type",
      msg: `A ${loc.type.replace(/_/g, " ")} in the ${loc.dimension} is unusual.`,
    });
  }

  return { errors, warnings: [...warnings, ...extraWarnings] };
}

/**
 * Live search. docs/07-ALGORITHMS.md §7.1
 * Priority: exact name > name prefix > name substring > tags > notes.
 * Notes MUST be searched — the ocean monument in the seed data is findable
 * only through its note.
 */
function searchLocations(all, q) {
  const needle = String(q ?? "").trim().toLowerCase();
  if (!needle) return [...all];

  return all
    .map(l => {
      const name  = l.name.toLowerCase();
      const tags  = l.tags.join(" ").toLowerCase();
      const notes = l.notes.toLowerCase();

      let score = 0;
      if (name === needle)              score = 100;
      else if (name.startsWith(needle)) score = 80;
      else if (name.includes(needle))   score = 60;
      else if (tags.includes(needle))   score = 40;
      else if (notes.includes(needle))  score = 20;

      return { l, score };
    })
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score || a.l.name.localeCompare(b.l.name))
    .map(r => r.l);
}

/** Dimension + type filter chips. Both null means "no filter". */
function filterLocations(all, filters = {}) {
  return all.filter(l =>
    (!filters.dimension || l.dimension === filters.dimension) &&
    (!filters.type      || l.type      === filters.type));
}

/* --------------------------------------------------------------------------
   IMPORT / EXPORT — docs/07-ALGORITHMS.md §6
   -------------------------------------------------------------------------- */

/** Three integers separated by "/" or whitespace. Global: a line may hold several. */
const COORD = /(-?\d+)\s*[\/ ]\s*(-?\d+)\s*[\/ ]\s*(-?\d+)/g;

/**
 * Pull every coordinate triple off a line; whatever is left becomes the label.
 * `matchAll` clones the regex internally, so the shared /g literal carries no
 * lastIndex state between calls.
 */
function parseLine(line) {
  const coords = [...String(line).matchAll(COORD)]
    .map(m => ({ x: +m[1], y: +m[2], z: +m[3] }));

  const label = String(line)
    .replace(COORD, " ")
    .replace(/[-\/]{2,}/g, " ")            // "----" style separators
    .replace(/\s+/g, " ")
    .replace(/^[\s\-–—:,.]+|[\s\-–—:,.]+$/g, "")   // dangling "Home - " punctuation
    .trim();

  return { coords, label, raw: String(line) };
}

/**
 * Guess a dimension from Y and the label. docs/07-ALGORITHMS.md §6.3
 *
 * Returning null is the correct answer far more often than it feels like it
 * should be. The guess is a typing shortcut, never a decision — the review
 * screen flags it and the user confirms every row.
 *
 * Deviation from the doc: the Y-range test runs FIRST. It is the only rule that
 * can be confident, because the Nether is bedrock-capped at 0..127 — a Y outside
 * that range makes "nether" impossible no matter what the label says.
 * The doc also wrote the keyword alternation without a group, so `\b` bound only
 * to the first and last alternatives; grouped here.
 */
function guessDimension({ y, label }) {
  const l = String(label ?? "").toLowerCase();

  if (y != null && Number.isFinite(y) && (y < 0 || y > 127)) {
    return { d: "overworld", confident: true };
  }
  if (/\b(nether|fortress|bastion|wart|blaze|soul|ghast|piglin)\b/.test(l)) {
    return { d: "nether", confident: false };
  }
  if (/\b(end|ender|stronghold|dragon|shulker|chorus)\b/.test(l)) {
    return { d: "end", confident: false };
  }
  return { d: null, confident: false };
}

/** A light type guess from the label. Always overridable in the review table. */
function guessType(label) {
  const l = String(label ?? "").toLowerCase();
  const rules = [
    [/\bportal\b/, "portal"], [/\bspawner\b/, "spawner"], [/\bfortress\b/, "fortress"],
    [/\bbastion\b/, "bastion"], [/\bmonument\b/, "monument"], [/\bshipwreck\b/, "shipwreck"],
    [/\bvillage\b/, "village"], [/\bstronghold\b/, "stronghold"], [/\btrial\b/, "trial_chamber"],
    [/\bbiome\b|\bjungle\b|\bdesert\b|\bforest\b/, "biome"], [/\bfarm\b/, "farm"],
    [/\bmine\b|\bcave\b/, "mine"], [/\bbase\b|\bhome\b/, "base"],
  ];
  for (const [re, t] of rules) if (re.test(l)) return t;
  return "misc";
}

/**
 * Turn pasted text into candidate rows for the review screen.
 *
 * TWO COORDINATES ON ONE LINE ARE NEVER A PAIR. The original notes contain
 * exactly that trap: 631/67/245 and -495/66/-394 shared a line separated by
 * "----" and are demonstrably not a pair (631 / 8 = 78, not -495).
 * docs/07-ALGORITHMS.md §6.2
 */
function buildImportRows(text) {
  const rows = [];
  const unrecognised = [];

  for (const raw of String(text ?? "").split(/\r?\n/)) {
    if (!raw.trim()) continue;
    const { coords, label } = parseLine(raw);

    if (coords.length === 0) { unrecognised.push(raw.trim()); continue; }

    coords.forEach((c, i) => {
      const named = Boolean(label);
      const base = named ? label : "(unnamed)";
      const g = guessDimension({ y: c.y, label });
      rows.push({
        name: coords.length > 1 ? `${base} (${i + 1})` : base,
        x: c.x, y: c.y, z: c.z,
        dimension: g.d,
        guessed: g.d !== null,
        confident: g.confident,
        type: guessType(label),
        checked: named,          // unnamed rows are unchecked by default
        raw: raw.trim(),
      });
    });
  }

  return { rows, unrecognised };
}

/** Validate a parsed JSON export BEFORE any of it touches state. */
function validateImportPayload(obj) {
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) {
    return { ok: false, error: "That file is not a JSON object." };
  }
  if (obj.app !== "blockbook") {
    return { ok: false, error: 'Not a BlockBook export — the file has no `"app": "blockbook"` marker.' };
  }
  const v = Number(obj.schemaVersion ?? 1);
  if (!Number.isFinite(v)) {
    return { ok: false, error: "The file has no readable schemaVersion." };
  }
  if (v > SCHEMA_VERSION) {
    return { ok: false, error: `Written by a newer version of BlockBook (schema ${v}; this build understands ${SCHEMA_VERSION}). Nothing has been changed.` };
  }
  const locations = obj.worlds?.[0]?.locations;
  if (!Array.isArray(locations)) {
    return { ok: false, error: "The file contains no locations." };
  }
  return { ok: true, locations, schemaVersion: v };
}

/** Merge is append-only: an id that already exists is skipped, never overwritten. */
function mergeLocations(existing, incoming) {
  const have = new Set(existing.map(l => l.id));
  const added = [], skipped = [];
  for (const l of incoming) (have.has(l.id) ? skipped : added).push(l);
  return { added, skipped };
}

/** `/tp 221 65 374`. A null Y becomes `~` — the player's current height. */
function tpCommand(loc) {
  return `/tp ${loc.x} ${loc.y === null ? "~" : loc.y} ${loc.z}`;
}

/** blockbook-YYYY-MM-DD.json */
function exportFilename(now = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `blockbook-${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}.json`;
}

/**
 * Sort comparators. docs/07-ALGORITHMS.md §7.2
 * ISO 8601 UTC strings sort lexicographically in chronological order, so
 * `updated` needs no Date parsing and carries no timezone hazard.
 */
const SORTERS = {
  name:    (a, b) => a.name.localeCompare(b.name),
  type:    (a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name),
  updated: (a, b) => b.updatedAt.localeCompare(a.updatedAt) || a.name.localeCompare(b.name),
};

function sortLocations(list, key) {
  return [...list].sort(SORTERS[key] ?? SORTERS.updated);
}

/**
 * The display pipeline: filter, then search, then sort.
 *
 * When a search query is present, relevance wins over the sort control.
 * Journey A requires "best match first" and the list must never need scrolling
 * to reach the top hit; honouring the sort control mid-search would break that.
 * The sort control governs the unsearched list. docs/03-APP-FLOW.md §3
 */
function visibleLocations(all, ui) {
  const filtered = filterLocations(all, ui.filters);
  return String(ui.search ?? "").trim()
    ? searchLocations(filtered, ui.search)
    : sortLocations(filtered, ui.sort);
}

/* ==========================================================================
   PRESENTATION CONSTANTS — docs/04-UIUX-SPEC.md §4.2, §4.3
   Emoji, not an icon pack: zero bytes, zero build step, already themed. ADR-011
   ========================================================================== */

const TYPE_ICONS = {
  base: "\u{1F3E0}", portal: "\u{1F300}", spawner: "\u{1F480}",
  structure: "\u{1F3DB}", biome: "\u{1F333}", mine: "⛏",
  farm: "\u{1F33E}", village: "\u{1F3D8}", stronghold: "\u{1F3F0}",
  fortress: "\u{1F525}", bastion: "\u{1F437}", monument: "\u{1F531}",
  shipwreck: "\u{1F6A2}", trial_chamber: "⚔", misc: "\u{1F4CD}",
};

const DIM_LABEL = { overworld: "OW", nether: "NE", end: "EN" };
const DIM_NAME  = { overworld: "Overworld", nether: "Nether", end: "End" };

const TABS = [
  { id: "coordinates", label: "Coordinates" },
  { id: "portals",     label: "Portals"     },
  { id: "brewing",     label: "Brewing"     },
  { id: "reference",   label: "Reference"   },
];

const SORT_OPTIONS = [
  { id: "updated", label: "Recently updated" },
  { id: "name",    label: "Name"             },
  { id: "type",    label: "Type"             },
];


/* ==========================================================================
   STATE
   `data` is persisted. `ui` is never persisted — restoring a stale filter on
   launch would silently hide locations. docs/02-TRD.md §3.3
   ========================================================================== */

let state = {
  data: null,          // set by boot()
  notice: null,        // {kind:"error"|"info", text} — rendered as a banner
  fatal: false,        // true = refuse to touch storage (e.g. newer schema)
  toast: null,
  ui: {
    activeTab:      "coordinates",   // coordinates | portals | brewing | reference
    search:         "",
    filters:        { dimension: null, type: null },
    sort:           "updated",       // name | type | updated
    editingId:      null,
    modal:          null,            // null | "edit" | "confirm-delete"
    draft:          null,            // in-progress form values
    confirmId:      null,
    ignoreConflict: false,           // per-edit-session only; never persisted
    conv:           { src: "overworld", x: "", z: "" },   // Portals tab converter
    import:         { rows: [], unrecognised: [] },
    pendingImport:  null,
    recentlyViewed: [],
  },
};

/** Locations of the active world. */
function activeLocations() {
  if (!state.data) return [];
  const w = state.data.worlds.find(w => w.id === state.data.settings.activeWorldId)
         ?? state.data.worlds[0];
  return w.locations;
}


/* ==========================================================================
   STORE — docs/02-TRD.md §5, §8
   v0.x persists to localStorage. Phase 10 swaps this for data.json with atomic
   writes and rolling backups; the serialised shape is identical, so that is a
   transport change, not a schema change.
   ========================================================================== */

const STORAGE_KEY = "blockbook.data";
const SAVE_DEBOUNCE_MS = 400;

let saveTimer = null;
let saveStatus = "saved";   // saved | saving | error

/**
 * Quarantine unreadable data instead of overwriting it. The user's coordinates
 * are not reconstructible, so a bad parse must never cost them the file.
 */
function quarantine(raw, why) {
  const key = `${STORAGE_KEY}.corrupt-${new Date().toISOString().replace(/[:.]/g, "-")}`;
  try { localStorage.setItem(key, raw); } catch { /* storage full — nothing safe to do */ }
  return key;
}

function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch { return { data: buildInitialData(SEED_LOCATIONS).data,
                   notice: { kind: "error", text: "localStorage is unavailable — changes will not persist this session." } }; }

  if (!raw) {
    // Not an error: first run. Seed it.
    return { data: buildInitialData(SEED_LOCATIONS).data, notice: null };
  }

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch {
    const key = quarantine(raw);
    return {
      data: buildInitialData(SEED_LOCATIONS).data,
      notice: { kind: "error", text: `Saved data was unreadable. It has been kept at <code>${esc(key)}</code> and the seed data loaded instead. Nothing was overwritten.` },
    };
  }

  if (parsed?.app !== "blockbook") {
    const key = quarantine(raw);
    return {
      data: buildInitialData(SEED_LOCATIONS).data,
      notice: { kind: "error", text: `Saved data is not a BlockBook file. It has been kept at <code>${esc(key)}</code>.` },
    };
  }

  const found = Number(parsed.schemaVersion ?? 1);
  if (found > SCHEMA_VERSION) {
    // Refuse. Never migrate downward. docs/02-TRD.md §8
    return {
      data: null,
      fatal: true,
      notice: { kind: "error", text: `This data was written by a newer version of BlockBook (schema ${found}; this build understands ${SCHEMA_VERSION}). Nothing has been changed. Update the app, or open an older export.` },
    };
  }

  // found < SCHEMA_VERSION would run migrations here. There are none at v1.

  const locations = (parsed.worlds?.[0]?.locations ?? []).map((l, i) => normaliseLocation(l, i, l.createdAt ?? new Date().toISOString()));
  const repairs = repairPortalLinks(locations);
  parsed.worlds[0].locations = locations;
  parsed.settings = { ...DEFAULT_SETTINGS, ...(parsed.settings ?? {}) };

  return {
    data: parsed,
    notice: repairs.length
      ? { kind: "info", text: `Repaired ${repairs.length} portal link(s) on load: ${esc(repairs.join("; "))}` }
      : null,
  };
}

function writeNow() {
  if (state.fatal || !state.data) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    saveStatus = "saved";
  } catch (err) {
    // Keep the in-memory state and surface it. Never silently discard a change.
    saveStatus = "error";
    state.notice = { kind: "error", text: `Could not save: ${esc(err.message)}. Your changes are still here, but they are not written to disk.` };
  }
  renderStatusBar();
}

/** Debounced so typing in a notes field does not write on every keystroke. */
function save() {
  if (state.fatal) return;
  saveStatus = "saving";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeNow, SAVE_DEBOUNCE_MS);
}

/** Flush any pending write. Called before the page goes away. */
function flush() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; writeNow(); }
}

window.addEventListener("beforeunload", flush);
window.addEventListener("pagehide", flush);


/* ==========================================================================
   MUTATIONS
   Every mutation goes through here: touch updatedAt, repair links, save,
   render. Nothing reaches into the DOM to patch a single node.
   ========================================================================== */

function newId() {
  return (crypto?.randomUUID?.() ?? `loc_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`);
}

/**
 * Point `loc` at `partnerId`, writing BOTH sides and unhooking whoever either
 * side was previously paired with.
 *
 * Without the unhooking step, re-pairing leaves a third portal pointing at a
 * partner that no longer points back, and repairPortalLinks would then "repair"
 * it by flipping the new link back — an order-dependent tug of war.
 */
function setPortalLink(loc, partnerId, all) {
  const byId = (id) => (id ? all.find(l => l.id === id) : null);
  const now = new Date().toISOString();

  const myOld = byId(loc.linkedPortalId);
  if (myOld && myOld.id !== partnerId) { myOld.linkedPortalId = null; myOld.updatedAt = now; }

  const partner = byId(partnerId);
  if (partner) {
    const theirOld = byId(partner.linkedPortalId);
    if (theirOld && theirOld.id !== loc.id) { theirOld.linkedPortalId = null; theirOld.updatedAt = now; }
    partner.linkedPortalId = loc.id;
    partner.updatedAt = now;
  }

  loc.linkedPortalId = partnerId ?? null;
}

function commitLocation(draft) {
  const now = new Date().toISOString();
  const locs = activeLocations();
  const existing = locs.find(l => l.id === draft.id);
  const wantedLink = draft.linkedPortalId ?? null;

  let target;
  if (existing) {
    Object.assign(existing, draft, {
      createdAt: existing.createdAt,
      updatedAt: now,
      linkedPortalId: existing.linkedPortalId,   // handled by setPortalLink below
    });
    target = existing;
  } else {
    target = normaliseLocation(
      { ...draft, id: draft.id ?? newId(), linkedPortalId: null, createdAt: now, updatedAt: now },
      locs.length, now);
    locs.push(target);
  }

  setPortalLink(target, target.type === "portal" ? wantedLink : null, locs);
  repairPortalLinks(locs);
  save();
  return existing ? "updated" : "added";
}

function deleteLocation(id) {
  const locs = activeLocations();
  const i = locs.findIndex(l => l.id === id);
  if (i === -1) return null;
  const [gone] = locs.splice(i, 1);

  // Any portal that pointed at the deleted record now dangles — I2 clears it.
  repairPortalLinks(locs);
  save();
  return gone;
}

/**
 * Snapshot the current data before anything bulk touches it.
 * docs/10-DECISIONS-AND-RISKS.md ADR-007/ADR-008 — a backup is written before
 * every import, without exception.
 */
function backupNow(reason) {
  if (state.fatal || !state.data) return null;
  const key = `${STORAGE_KEY}.backup-${reason}-${new Date().toISOString().replace(/[:.]/g, "-")}`;
  try { localStorage.setItem(key, JSON.stringify(state.data)); return key; }
  catch { return null; }
}

function exportPayload() {
  return JSON.stringify(state.data, null, 2);   // 2-space indent, hand-editable
}

/**
 * Commit a JSON import. Merge appends and never overwrites; replace wipes, and
 * only ever reaches here after an explicit second confirmation.
 * @returns {{added:number, skipped:number, mode:string}}
 */
function commitJsonImport(locations, mode) {
  backupNow(mode === "replace" ? "before-replace" : "before-merge");

  const now = new Date().toISOString();
  const incoming = locations.map((l, i) => normaliseLocation(l, i, l.createdAt ?? now));
  const world = state.data.worlds[0];

  let added = 0, skipped = 0;
  if (mode === "replace") {
    world.locations = incoming;
    added = incoming.length;
  } else {
    const r = mergeLocations(world.locations, incoming);
    world.locations.push(...r.added);
    added = r.added.length;
    skipped = r.skipped.length;
  }

  repairPortalLinks(world.locations);
  flush();                     // bulk changes are written immediately, not debounced
  return { added, skipped, mode };
}

/** Commit the reviewed Notepad rows. Always appends. */
function commitTextImport(rows) {
  backupNow("before-text-import");

  const now = new Date().toISOString();
  const locs = activeLocations();
  const accepted = rows.filter(r => r.checked && DIMENSIONS.includes(r.dimension));

  for (const r of accepted) {
    locs.push(normaliseLocation({
      id: newId(),
      name: r.name.trim() || "(unnamed)",
      dimension: r.dimension,
      x: r.x, y: r.y, z: r.z,
      type: r.type,
      tags: ["imported"],
      notes: `Imported from text: "${r.raw}"`,
      linkedPortalId: null,
      favorite: false,
      createdAt: now, updatedAt: now,
    }, locs.length, now));
  }

  repairPortalLinks(locs);
  flush();
  return accepted.length;
}

function toggleFavorite(id) {
  const loc = activeLocations().find(l => l.id === id);
  if (!loc) return;
  loc.favorite = !loc.favorite;
  loc.updatedAt = new Date().toISOString();
  save();
}


/* ==========================================================================
   FORM DRAFT
   ========================================================================== */

/*
 * The draft holds the coordinate and tag fields as RAW STRINGS, not parsed
 * values. The modal re-renders on every keystroke, so if it wrote back a parsed
 * value the user could never type a lone "-" (Number("-") is NaN, so the minus
 * sign would vanish before they reached the digits) or a trailing "," in tags.
 * Parse on demand instead, via draftToLocation().
 */

/** Blank draft. `dimension` is deliberately undefined — ADR-005. */
function blankDraft() {
  return {
    id: null, name: "", dimension: undefined,
    xRaw: "", yRaw: "", zRaw: "",
    type: "misc", tagsRaw: "", notes: "",
    linkedPortalId: null, favorite: false,
  };
}

function draftFrom(loc) {
  return {
    id: loc.id, name: loc.name, dimension: loc.dimension,
    xRaw: String(loc.x), yRaw: loc.y === null ? "" : String(loc.y), zRaw: String(loc.z),
    type: loc.type, tagsRaw: loc.tags.join(", "), notes: loc.notes,
    linkedPortalId: loc.linkedPortalId, favorite: loc.favorite,
  };
}

/** Draft (raw strings) -> Location shape, for validation and commit. */
function draftToLocation(d) {
  return {
    id:   d.id,
    name: d.name.trim(),
    dimension: d.dimension,
    x: parseCoordInput(d.xRaw),
    y: parseYInput(d.yRaw),
    z: parseCoordInput(d.zRaw),
    type: d.type,
    tags: parseTagsInput(d.tagsRaw),
    notes: d.notes,
    linkedPortalId: d.linkedPortalId,
    favorite: d.favorite,
  };
}

/** "12.7" -> 12 (V3). "" -> NaN so E3 fires. */
function parseCoordInput(v) {
  const s = String(v).trim();
  if (s === "") return NaN;
  const n = Number(s);
  return Number.isFinite(n) ? Math.floor(n) : NaN;
}

/** "" -> null ("surface, don't care"). Never 0. */
function parseYInput(v) {
  const s = String(v).trim();
  if (s === "") return null;
  const n = Number(s);
  return Number.isFinite(n) ? Math.floor(n) : NaN;
}

function parseTagsInput(v) {
  return normaliseTags(String(v).split(","));
}


/* ==========================================================================
   RENDER — docs/02-TRD.md §3.3
   ONE render() that rebuilds the active tab from state. No component
   framework, no partial DOM patching: at this data size a full rebuild is
   well inside the 100 ms budget, and simplicity is worth more than the
   microseconds. Measure before optimising.
   ========================================================================== */

const $ = (id) => document.getElementById(id);

/** Escape text before it goes anywhere near innerHTML. */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/**
 * Format a coordinate for display.
 * A null Y renders as an em dash in --fg-2, never as 0 and never blank —
 * "deliberately unknown" must not read as a real value. docs/04-UIUX-SPEC.md §6
 */
function coordHTML(loc) {
  const sep = state.data.settings.coordFormat === "x, y, z" ? ", "
            : state.data.settings.coordFormat === "x y z"   ? " "
            : " / ";
  const y = loc.y === null ? '<span class="nil">&mdash;</span>' : esc(loc.y);
  return `${esc(loc.x)}${sep}${y}${sep}${esc(loc.z)}`;
}

function cardHTML(loc) {
  const icon = TYPE_ICONS[loc.type] ?? TYPE_ICONS.misc;
  const tags = loc.tags.length
    ? `<div class="tags">${loc.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>`
    : "";

  // Show the note only when the search matched it and nothing else — otherwise
  // the user cannot see why the row is in the results.
  const q = state.ui.search.trim().toLowerCase();
  const matchedNote = q && loc.notes.toLowerCase().includes(q)
                        && !loc.name.toLowerCase().includes(q)
                        && !loc.tags.join(" ").toLowerCase().includes(q);
  const note = matchedNote
    ? `<div class="note-preview" title="${esc(loc.notes)}">${esc(loc.notes)}</div>`
    : "";

  return `
    <article class="card${loc.favorite ? " is-favorite" : ""}" data-id="${esc(loc.id)}">
      <div class="card-main">
        <span class="card-icon" title="${esc(loc.type)}">${icon}</span>
        <span class="card-name" title="${esc(loc.name)}">${esc(loc.name)}</span>
        <span class="coord">${coordHTML(loc)}</span>
        <span class="badge ${esc(loc.dimension)}" title="${esc(DIM_NAME[loc.dimension] ?? "Unknown")}">${esc(DIM_LABEL[loc.dimension] ?? "??")}</span>
        <span class="card-actions">
          <button class="btn ghost" data-act="tp" data-id="${esc(loc.id)}"
                  title="Copy ${esc(tpCommand(loc))}">/tp</button>
          <button class="btn ghost" data-act="fav" data-id="${esc(loc.id)}"
                  title="${loc.favorite ? "Remove from favourites" : "Add to favourites"}">${loc.favorite ? "★" : "☆"}</button>
          <button class="btn ghost" data-act="edit" data-id="${esc(loc.id)}">Edit</button>
          <button class="btn ghost" data-act="del" data-id="${esc(loc.id)}" title="Delete">&#128465;</button>
        </span>
      </div>
      ${portalRowHTML(loc, activeLocations())}
      ${tags}
      ${note}
    </article>`;
}

function stubHTML(glyph, title, body, items) {
  return `
    <div class="stub">
      <span class="glyph">${glyph}</span>
      <h2>${esc(title)}</h2>
      <p>${esc(body)}</p>
      ${items ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    </div>`;
}

function renderTabs() {
  $("tabs").innerHTML = TABS.map(t => `
    <button class="tab" role="tab" data-tab="${t.id}"
            aria-selected="${state.ui.activeTab === t.id}">${esc(t.label)}</button>
  `).join("");
}

function renderToolbar() {
  if (state.ui.activeTab !== "coordinates" || state.fatal) { $("toolbar").innerHTML = ""; return; }

  const { dimension, type } = state.ui.filters;
  const dimChip = (id, label) => `
    <button class="fchip" data-filter="dimension" data-dim="${id}" data-value="${id}"
            aria-pressed="${(dimension ?? "") === id}">${esc(label)}</button>`;

  const shown = visibleLocations(activeLocations(), state.ui).length;
  const total = activeLocations().length;

  $("toolbar").innerHTML = `
    <div class="toolbar-rows">
      <div class="toolbar-row">
        <span class="search-wrap">
          <span class="glass">&#128269;</span>
          <input type="text" id="search" placeholder="Search locations…"
                 autocomplete="off" spellcheck="false"
                 aria-label="Search locations"
                 value="${esc(state.ui.search)}">
        </span>
        <button class="btn primary" data-act="add">+ Add</button>
      </div>
      <div class="toolbar-row">
        <span class="chips">
          ${dimChip("", "All")}
          ${dimChip("overworld", "\u{1F7E9} Overworld")}
          ${dimChip("nether", "\u{1F7E5} Nether")}
          ${dimChip("end", "\u{1F7EA} End")}
        </span>
        <select id="type-filter" aria-label="Filter by type">
          <option value="">All types</option>
          ${LOCATION_TYPES.map(t => `
            <option value="${t}"${type === t ? " selected" : ""}>${TYPE_ICONS[t]} ${esc(t.replace(/_/g, " "))}</option>
          `).join("")}
        </select>
        <span class="spacer"></span>
        <label for="sort">Sort</label>
        <select id="sort" aria-label="Sort order"${state.ui.search.trim() ? " disabled title='Relevance ordering is used while searching'" : ""}>
          ${SORT_OPTIONS.map(o => `
            <option value="${o.id}"${state.ui.sort === o.id ? " selected" : ""}>${esc(o.label)}</option>
          `).join("")}
        </select>
        <span class="count" aria-live="polite">${shown === total ? `${total} locations` : `${shown} of ${total}`}</span>
      </div>
    </div>
  `;
}

function emptyStateHTML() {
  const { search, filters } = state.ui;
  if (search.trim()) {
    return `<div class="empty">
      <span class="glyph">&#128269;</span>
      <div>No match for <strong>${esc(search.trim())}</strong>.</div>
      <button class="btn" data-act="clear-search">Clear search</button>
    </div>`;
  }
  if (filters.dimension || filters.type) {
    const bits = [filters.dimension && DIM_NAME[filters.dimension],
                  filters.type && filters.type.replace(/_/g, " ")].filter(Boolean).join(" · ");
    return `<div class="empty">

/* ---- portal widgets — docs/04-UIUX-SPEC.md §4.4, §4.7, §4.8 ---- */

const HEALTH_BADGE = {
  tight:  { icon: "✅", label: "Tight",  cls: "ok",   tip: "Reliably paired in both directions." },
  loose:  { icon: "🟡", label: "Loose",  cls: "warn", tip: "Both directions link, but another portal could steal it." },
  broken: { icon: "❌", label: "Broken", cls: "bad",  tip: "At least one direction does NOT reach the partner." },
};

function healthBadgeHTML(loc, all) {
  if (loc.type !== "portal") return "";
  if (loc.dimension === "end") return `<span class="health muted">— no counterpart</span>`;

  const partner = loc.linkedPortalId ? all.find(l => l.id === loc.linkedPortalId) : null;
  if (!partner) return `<span class="health muted" title="No partner recorded.">— Unlinked</span>`;

  const h = linkHealth(loc, partner);
  if (!h) return `<span class="health muted">— Unlinked</span>`;
  const b = HEALTH_BADGE[h.status];
  return `<span class="health ${b.cls}"
    title="${esc(b.tip)} Forward ${fmtDist(h.forward)}, backward ${fmtDist(h.backward)}."
    >${b.icon} ${b.label} &rarr; ${esc(partner.name)}</span>`;
}

/** Row 2 of a portal card: where it lands, and whether the pair holds. */
function portalRowHTML(loc, all) {
  if (loc.type !== "portal") return "";
  const cp = counterpart(loc);
  const where = cp
    ? `<span class="muted">&harr; ${esc(cp.dimension)}</span> <span class="coord">${cp.x} / ${cp.z}</span>`
    : `<span class="muted">&harr; the End has no counterpart</span>`;
  return `<div class="portal-row">${where} ${healthBadgeHTML(loc, all)}</div>`;
}

/** The live panel inside the Add/Edit modal when type === "portal". */
function portalPanelHTML(loc, all) {
  const cp = counterpart(loc);
  const dest = destinationDimension(loc.dimension);

  if (!dest) {
    return `<div class="portal-panel">
      <div class="hint">End portals have no counterpart and cannot be paired.</div>
    </div>`;
  }
  if (!cp) {
    return `<div class="portal-panel">
      <div class="hint">Enter X and Z to see the counterpart and check for link conflicts.</div>
    </div>`;
  }

  const conflicts = findLinkConflicts(loc, all).filter(c => c.location.id !== loc.linkedPortalId);
  const nearest = conflicts[0];
  const ignored = state.ui.ignoreConflict;

  const verdict = !nearest
    ? `<div class="verdict ok">✅ Will create a new portal at ~<span class="coord">${cp.x} / ${cp.z}</span>.</div>`
    : ignored
      ? `<div class="verdict warn">⚠ Conflict acknowledged: “${esc(nearest.location.name)}” (${fmtDist(nearest.distance)} blocks).</div>`
      : `<div class="verdict warn">
           ⚠ Will likely link to <strong>${esc(nearest.location.name)}</strong>
           (${fmtDist(nearest.distance)} blocks away). Build further out, or accept the link.
           <div class="verdict-actions">
             <button type="button" class="btn" data-act="link-nearest" data-id="${esc(nearest.location.id)}">Link them</button>
             <button type="button" class="btn ghost" data-act="ignore-conflict">Ignore</button>
           </div>
         </div>`;

  const candidates = all.filter(l => l.type === "portal" && l.dimension === dest && l.id !== loc.id);

  return `
    <div class="portal-panel">
      <div class="cp-line">&harr; Counterpart in the ${esc(dest)}:
        <span class="coord">${cp.x} / ${cp.z}</span></div>
      ${verdict}
      <div class="field" style="margin:var(--s-3) 0 0">
        <label for="f-link">Links to</label>
        <select id="f-link">
          <option value="">— none —</option>
          ${candidates.map(c => `
            <option value="${esc(c.id)}"${loc.linkedPortalId === c.id ? " selected" : ""}>
              ${esc(c.name)} (${c.x} / ${c.z})
            </option>`).join("")}
        </select>
        ${candidates.length === 0 ? `<div class="hint">No ${esc(dest)} portals recorded yet.</div>` : ""}
      </div>
    </div>`;
}

/* ---- Portals tab converter — docs/04-UIUX-SPEC.md §4.8 ---- */

function convertAxis(raw, dir) {
  const s = String(raw).trim();
  if (s === "" || !/^-?\d+$/.test(s)) return "";
  const n = Number(s);
  return String(dir === "toNether" ? Math.floor(n / 8) : n * 8);
}

function converterHTML() {
  const c = state.ui.conv;
  const srcIsOW = c.src === "overworld";

  const owX = srcIsOW ? c.x : convertAxis(c.x, "toOverworld");
  const owZ = srcIsOW ? c.z : convertAxis(c.z, "toOverworld");
  const neX = srcIsOW ? convertAxis(c.x, "toNether") : c.x;
  const neZ = srcIsOW ? convertAxis(c.z, "toNether") : c.z;

  // Conflicts against the destination of whatever side is being typed into.
  const x = Number(c.x), z = Number(c.z);
  const usable = /^-?\d+$/.test(c.x.trim()) && /^-?\d+$/.test(c.z.trim());
  const probe = usable ? { dimension: c.src, x: Math.floor(x), z: Math.floor(z), id: null } : null;
  const cp = probe ? counterpart(probe) : null;
  const conflicts = probe ? findLinkConflicts(probe, activeLocations()) : [];

  return `
    <div class="converter">
      <div class="conv-side ow">
        <div class="conv-title"><span class="badge overworld">OW</span> Overworld</div>
        <label>X <input type="text" inputmode="numeric" class="conv-in" data-conv="overworld" data-axis="x" value="${esc(owX)}" autocomplete="off"></label>
        <label>Z <input type="text" inputmode="numeric" class="conv-in" data-conv="overworld" data-axis="z" value="${esc(owZ)}" autocomplete="off"></label>
      </div>
      <div class="conv-arrow">&harr;</div>
      <div class="conv-side ne">
        <div class="conv-title"><span class="badge nether">NE</span> Nether</div>
        <label>X <input type="text" inputmode="numeric" class="conv-in" data-conv="nether" data-axis="x" value="${esc(neX)}" autocomplete="off"></label>
        <label>Z <input type="text" inputmode="numeric" class="conv-in" data-conv="nether" data-axis="z" value="${esc(neZ)}" autocomplete="off"></label>
      </div>
    </div>
    <p class="conv-note">Y is not converted. Nether Y and Overworld Y are unrelated.</p>
    ${cp ? `
      <div class="section-label">Portals near ${cp.x} / ${cp.z} &middot; ${esc(cp.dimension)}</div>
      ${conflicts.length === 0
        ? `<div class="verdict ok">✅ Nothing within ${LINK_RADIUS} blocks — a new portal would be created here.</div>`
        : `<div class="list">${conflicts.map(c2 => `
            <article class="card">
              <div class="card-main">
                <span class="card-icon">${TYPE_ICONS.portal}</span>
                <span class="card-name">${esc(c2.location.name)}</span>
                <span class="coord">${c2.location.x} / ${c2.location.z}</span>
                <span class="badge ${esc(c2.location.dimension)}">${DIM_LABEL[c2.location.dimension]}</span>
                <span class="health warn">${fmtDist(c2.distance)} blocks</span>
              </div>
            </article>`).join("")}</div>`}
    ` : `<p class="conv-note">Enter an X and a Z to check for link conflicts.</p>`}
  `;
}

function portalsPanelHTML() {
  const all = activeLocations();
  const portals = all.filter(l => l.type === "portal");
  const broken = brokenPairs(all);
  const unlinked = portals.filter(p => !p.linkedPortalId && p.dimension !== "end").length;

  return `
    ${converterHTML()}
    <div class="section-label" style="margin-top:var(--s-5)">
      All portals &middot; ${portals.length}
      ${broken.length ? `<span class="health bad">&middot; ${broken.length} broken pair${broken.length > 1 ? "s" : ""}</span>` : ""}
      ${unlinked ? `<span class="muted">&middot; ${unlinked} unlinked</span>` : ""}
    </div>
    ${portals.length === 0
      ? `<div class="empty"><span class="glyph">${TYPE_ICONS.portal}</span><div>No portals recorded yet.</div></div>`
      : `<div class="list">${portals.map(p => `
          <article class="card${p.favorite ? " is-favorite" : ""}">
            <div class="card-main">
              <span class="card-icon">${TYPE_ICONS.portal}</span>
              <span class="card-name">${esc(p.name)}</span>
              <span class="coord">${coordHTML(p)}</span>
              <span class="badge ${esc(p.dimension)}">${DIM_LABEL[p.dimension] ?? "??"}</span>
              <span class="card-actions">
                <button class="btn ghost" data-act="edit" data-id="${esc(p.id)}">Edit</button>
              </span>
            </div>
            ${portalRowHTML(p, all)}
          </article>`).join("")}</div>`}
  `;
}

function renderEditModals() {
  const root = $("modal-root");

  if (state.ui.modal === "confirm-delete") {
    const loc = activeLocations().find(l => l.id === state.ui.confirmId);
    if (!loc) { root.innerHTML = ""; return; }
    root.innerHTML = `

          <div class="modal-foot">
            <button class="btn" data-act="close">Cancel</button>
